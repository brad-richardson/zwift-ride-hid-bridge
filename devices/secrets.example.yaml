# These names match the existing ESPHome Device Builder secrets. Do not put
# real values in this repository. A local devices/secrets.yaml is gitignored.
ssid: "REPLACE_WITH_WIFI_SSID"
password: "REPLACE_WITH_WIFI_PASSWORD"
fallback_password: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"
ota_password: "REPLACE_WITH_A_DIFFERENT_LONG_RANDOM_PASSWORD"

# Ride Left advertises manufacturer ID 0x094A, device ID 8. This is local
# configuration rather than a credential, but keep the device address out of Git.
ride_left_mac: "00:00:00:00:00:00"

# Replace with a newly generated 32-byte base64 ESPHome API key.
# This all-zero value is syntactically valid but intentionally insecure.
api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
