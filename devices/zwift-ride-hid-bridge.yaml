substitutions:
  name: zwift-ride-hid-bridge
  friendly_name: Zwift Ride HID Bridge

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4
  project:
    name: bradrichardson.zwift_ride_hid_bridge
    version: 0.1.0-dev

esp32:
  # Specific XIAO definition. If an older Device Builder rejects this ID,
  # temporarily use the already-proven esp32-s3-devkitc-1 definition.
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# The XIAO ESP32-S3 has 8 MB octal PSRAM. BLE's timing-sensitive buffers
# should still remain bounded and must not assume all allocations use PSRAM.
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret ssid
  password: !secret password
  output_power: 8.5db
  ap:
    ssid: "${friendly_name} ESP"
    password: !secret fallback_password

captive_portal:

logger:
  # TEMPORARY: DEBUG is required for the advertisement capture below. Return to
  # INFO once sleep_confirmation is settled; the Ride advertises continuously,
  # so this is a steady stream of log lines.
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:

text_sensor:
  - platform: version
    name: ESPHome Version
  - platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: SSID
    bssid:
      name: BSSID

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 120s

binary_sensor:
  - platform: status
    name: Status

button:
  - platform: restart
    name: "Restart ${friendly_name}"
  # The sleep/wake re-arm deliberately refuses to reconnect while the
  # controllers are still advertising, so this is the guaranteed escape hatch
  # when they are awake and the session is wanted back immediately.
  - platform: template
    name: Reconnect Ride Controllers
    entity_category: diagnostic
    on_press:
      - zwift_ride_hid.reconnect:

# Local source makes repository and CI builds compile the checked-out code.
# Replace this block with the immutable Git form in devices/README.md when the
# configuration lives in ESPHome Device Builder.
external_components:
  - source:
      type: local
      path: ../components
    components: [zwift_ride_hid]

# ESPHome owns scanning, the GATT client link, and Bluedroid lifecycle.
esp32_ble:
  max_connections: 3

esp32_ble_tracker:
  scan_parameters:
    # Active receive duty is 30/320 = 9.375% while Ride is disconnected.
    # The component pauses this global scanner as soon as the Ride client
    # leaves IDLE, and restores continuous scanning after full disconnect.
    duration: 5min
    interval: 320ms
    window: 30ms
    active: true
    continuous: true

ble_client:
  # The all-zero address enables zwift_ride_hid's exact Ride Left discovery
  # filter. Replace it with a real MAC only to pin one controller in a venue
  # where more than one Ride setup is visible.
  - mac_address: "00:00:00:00:00:00"
    id: ride_left
    auto_connect: true

zwift_ride_hid:
  ble_client_id: ride_left
  hid_name: Zwift Ride KB
  profile: delta_emulator
  analog_levers:
    press_threshold: 35
    release_threshold: 20
    # Useful during the hardware-validation phase. Disable after calibrating
    # the two lever signs if raw values are not needed in Home Assistant.
    expose_raw: true
  haptics:
    connect_confirmation: true
    # Per-button vibration can be distracting and adds BLE writes, so it is
    # opt-in even though the bridge supports it.
    button_feedback: false
  # The controllers stay awake while any central holds their GATT link, so an
  # unattended bridge would flatten their batteries. Releasing the link lets
  # them use their own sleep behavior; reconnecting is fast enough that the
  # trade is worth it.
  idle_timeout:
    # TEMPORARY: shortened from 15min to make the idle path testable in one
    # sitting. Restore 15min once the timings below are settled.
    disconnect_after: 5min
    # OBSERVATION MODE. Hardware showed Ride Left does not hold a steady
    # advertising rate after release: it backs off progressively, stretching
    # from ~325 ms to 2.2 s, 3.2 s, 4.8 s and 5.4 s over about two minutes on
    # the way to sleep. A 5 s threshold was crossed by that ramp and
    # reconnected into a still-awake controller.
    #
    # No fixed gap threshold can separate "backing off" from "asleep", so this
    # value is deliberately set beyond any plausible gap to suppress the
    # re-arm entirely while the full backoff curve is recorded. The
    # `armed to reconnect` log line then marks the moment advertising actually
    # stopped. Use the Reconnect Ride Controllers button to recover.
    sleep_confirmation: 10min
    # Disabled for the same reason: the cap would otherwise end the
    # observation before the controllers finish going to sleep.
    max_suppression: 0s
    # A connected keyboard makes iPadOS hide its on-screen keyboard, so the
    # bonded host is released for the duration of the idle period.
    release_hid: true
  # GPIO21 is the XIAO ESP32-S3's active-low orange user LED. The component
  # owns it so its pattern can describe Ride, HID, fault, and OTA state.
  status_led:
    number: GPIO21
    inverted: true
  diagnostics:
    ride_connected:
      name: Ride Controller Connected
    hid_connected:
      name: HID Host Ready
    ready:
      name: Bridge Ready
    state:
      name: Bridge State
    # True while Ride Left is present: either connected, or seen advertising
    # recently. False means it has gone quiet, which is the reading that
    # explains why a button press did or did not bring the session back.
    ride_advertising:
      name: Ride Advertising
    advertisement_age:
      name: Ride Advertisement Age
    reconnect_count:
      name: Ride Reconnect Count
    invalid_frame_count:
      name: Invalid Ride Frame Count
    hid_report_count:
      name: HID Report Count
    idle_disconnect_count:
      name: Ride Idle Disconnect Count
    setup_timeout_count:
      name: Ride Setup Timeout Count
    haptic_timeout_count:
      name: Ride Haptic Timeout Count
    left_lever:
      name: Left Lever Raw
      disabled_by_default: true
    right_lever:
      name: Right Lever Raw
      disabled_by_default: true
  debug_capture: false
  # TEMPORARY: logs every matching Ride advertisement with its manufacturer
  # payload, flags, and interval since the previous one. This is the capture
  # that establishes the real advertising cadence and shows whether a button
  # press changes the advertisement. Turn off once sleep_confirmation is set.
  debug_advertisements: true

# Intentionally omitted for the dual-role BLE feasibility test:
# web_server:
#   port: 80
