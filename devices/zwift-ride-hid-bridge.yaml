substitutions:
  name: zwift-ride-hid-bridge
  friendly_name: Zwift Ride HID Bridge

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4
  project:
    name: bradrichardson.zwift_ride_hid_bridge
    version: 0.1.0-dev

esp32:
  # Specific XIAO definition. If an older Device Builder rejects this ID,
  # temporarily use the already-proven esp32-s3-devkitc-1 definition.
  board: seeed_xiao_esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

# The XIAO ESP32-S3 has 8 MB octal PSRAM. BLE's timing-sensitive buffers
# should still remain bounded and must not assume all allocations use PSRAM.
psram:
  mode: octal
  speed: 80MHz

wifi:
  ssid: !secret ssid
  password: !secret password
  output_power: 8.5db
  ap:
    ssid: "${friendly_name} ESP"
    password: !secret fallback_password

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:

text_sensor:
  - platform: version
    name: ESPHome Version
  - platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: SSID
    bssid:
      name: BSSID

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 120s

binary_sensor:
  - platform: status
    name: Status

button:
  - platform: restart
    name: "Restart ${friendly_name}"
  # The sleep/wake re-arm deliberately refuses to reconnect while the
  # controllers are still advertising, so this is the guaranteed escape hatch
  # when they are awake and the session is wanted back immediately.
  - platform: template
    name: Reconnect Ride Controllers
    entity_category: diagnostic
    on_press:
      - zwift_ride_hid.reconnect:

# Local source makes repository and CI builds compile the checked-out code.
# Replace this block with the immutable Git form in devices/README.md when the
# configuration lives in ESPHome Device Builder.
external_components:
  - source:
      type: local
      path: ../components
    components: [zwift_ride_hid]

# ESPHome owns scanning, the GATT client link, and Bluedroid lifecycle.
esp32_ble:
  max_connections: 3

esp32_ble_tracker:
  scan_parameters:
    # 80/160 = 50% receive duty. The reconnect logic measures the controller's
    # advertising rate, and at the former 9.375% duty roughly half of all
    # advertisements were missed, which made the ~640 ms slow phase look like a
    # ~6 s one. The scanner only runs while the Ride link is down, and the HID
    # host is released during an idle period, so little else competes for the
    # radio.
    duration: 5min
    interval: 160ms
    window: 80ms
    active: true
    continuous: true

ble_client:
  # The all-zero address enables zwift_ride_hid's exact Ride Left discovery
  # filter. Replace it with a real MAC only to pin one controller in a venue
  # where more than one Ride setup is visible.
  - mac_address: "00:00:00:00:00:00"
    id: ride_left
    auto_connect: true

zwift_ride_hid:
  ble_client_id: ride_left
  hid_name: Zwift Ride KB
  profile: delta_emulator
  analog_levers:
    press_threshold: 35
    release_threshold: 20
    # Useful during the hardware-validation phase. Disable after calibrating
    # the two lever signs if raw values are not needed in Home Assistant.
    expose_raw: true
  haptics:
    connect_confirmation: true
    # Per-button vibration can be distracting and adds BLE writes, so it is
    # opt-in even though the bridge supports it.
    button_feedback: false
  # The controllers stay awake while any central holds their GATT link, so an
  # unattended bridge would flatten their batteries. Releasing the link lets
  # them use their own sleep behavior; reconnecting is fast enough that the
  # trade is worth it.
  idle_timeout:
    disconnect_after: 15min
    # Only feeds the Ride Controllers Powered diagnostic now. Reconnection is
    # decided by the measured advertising rate below, not by a silence
    # threshold.
    sleep_confirmation: 30s
    # Backstop only: a rate drop back to the fast phase is the normal route.
    max_suppression: 60min
    # A connected keyboard makes iPadOS hide its on-screen keyboard, so the
    # bonded host is released for the duration of the idle period.
    release_hid: true
    # Measured on hardware after a release: Ride Left advertises continuously
    # at ~196 ms for about two minutes, drops to a continuous ~640 ms, then
    # stops near 2m54s. Reconnection keys off that 3.3x rate change rather than
    # any gap between sightings: the measured rate rising past slow_rate latches
    # the slow phase, and falling back below wake_rate is the wake.
    #
    # Both thresholds sit inside the gap between the two regimes, so neither
    # phase can be mistaken for the other by a few missed packets. Deciding on
    # rate instead of silence is deliberate: gap-based models failed twice here,
    # once because the wind-down gaps grow smoothly through any fixed threshold,
    # and once because the ~640 ms slow phase satisfied a "burst of sightings"
    # test in under two seconds.
    slow_rate: 500ms
    wake_rate: 350ms
    rate_samples: 8
  # GPIO21 is the XIAO ESP32-S3's active-low orange user LED. The component
  # owns it so its pattern can describe Ride, HID, fault, and OTA state.
  status_led:
    number: GPIO21
    inverted: true
  diagnostics:
    ride_connected:
      name: Ride Controller Connected
    hid_connected:
      name: HID Host Ready
    ready:
      name: Bridge Ready
    state:
      name: Bridge State
    # True while Ride Left is present: either connected, or seen advertising
    # within sleep_confirmation. False means the controllers have switched
    # themselves off, which is the reading that explains why pressing a
    # control did nothing.
    ride_advertising:
      name: Ride Controllers Powered
    advertisement_age:
      name: Ride Advertisement Age (When Idle)
    # What the reconnect logic actually measures: ~196 ms while the controller
    # is awake, ~640 ms while winding down. If a reconnect misbehaves, this is
    # the reading that says whether the thresholds are wrong.
    advertising_rate:
      name: Ride Advertising Rate (When Idle)
    reconnect_count:
      name: Ride Reconnect Count
    invalid_frame_count:
      name: Invalid Ride Frame Count
    hid_report_count:
      name: HID Report Count
    idle_disconnect_count:
      name: Ride Idle Disconnect Count
    setup_timeout_count:
      name: Ride Setup Timeout Count
    haptic_timeout_count:
      name: Ride Haptic Timeout Count
    left_lever:
      name: Left Lever Raw
      disabled_by_default: true
    right_lever:
      name: Right Lever Raw
      disabled_by_default: true
  debug_capture: false
  # Logs every matching Ride advertisement with its manufacturer payload,
  # flags, and interval. Needed only to re-measure the advertising cadence,
  # and it puts the controller's address in the log stream, so leave it off.
  debug_advertisements: false

# Intentionally omitted for the dual-role BLE feasibility test:
# web_server:
#   port: 80
