[project]
name = "zwift-ride-hid-bridge-dev"
version = "0.0.0"
description = "Pinned local tooling for the Zwift Ride HID Bridge ESPHome component"
requires-python = ">=3.12"
dependencies = [
  "esphome==2026.7.4",
]

[dependency-groups]
# Operator tooling in tools/. Not installed by a plain `uv sync`, so CI keeps
# building with the ESPHome dependency set alone.
tools = [
  "websockets>=14",
]

[tool.uv]
package = false
